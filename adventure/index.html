<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092f32"><title>Mooshak’s Modak Mission · Grand Adventure</title><meta name="description" content="Three festive worlds, clever puzzles, and one little mouse. Collect offerings and decorate your own Ganesh Chaturthi pandal."><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./"><span class="brand-mark">✺</span><span>MOOSHAK’S<b>MODAK MISSION</b></span></a><div class="header-tools"><span class="edition">THE GRAND ADVENTURE</span><button id="sound" aria-pressed="false">♪ Sound off</button></div></header>
<section class="game-shell" aria-label="Mooshak’s adventure"><div class="hud"><div><span class="eyebrow" id="level-label">THREE WORLDS · ONE CELEBRATION</span><strong id="chapter">The festival awaits</strong></div><div class="stats"><span>🥟 <b id="score">0 / 8</b></span><span>🌼 <b id="flowers">0 / 3</b></span><span id="hearts" aria-label="3 hearts">♥ ♥ ♥</span><button id="pause" aria-label="Pause game">Ⅱ</button></div></div>
